# Convoy — publish the static mirror (the web app + the landing page) to
# GitHub Pages. scripts/build-pages.js assembles _site/; nothing under packs/,
# server/ or legal/ is ever in it (test/pages.test.js pins that). The mirror
# talks to the real backend named in the build (CONVOY_BACKEND, default
# https://odoreeci.tech) — see DEPLOY.md, "GitHub Pages mirror".
#
# Publishing goes through the classic gh-pages branch: the build is committed
# there and GitHub Pages serves it (Settings → Pages shows the URL). This needs
# no Pages API permission (the Actions-source path does, and the workflow token
# cannot create the site), only `contents: write`.
name: GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - index.html
      - 'js/**'
      - 'css/**'
      - 'fonts/**'
      - 'landing/**'
      - scripts/build-pages.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the static mirror
        run: node scripts/build-pages.js
        env:
          CONVOY_BACKEND: ${{ vars.CONVOY_BACKEND || 'https://odoreeci.tech' }}
      - name: Prove nothing pack-only is in it
        run: |
          test ! -e _site/packs && test ! -e _site/server && test ! -e _site/legal
          ls _site
      - name: Publish _site to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages mirror of ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
